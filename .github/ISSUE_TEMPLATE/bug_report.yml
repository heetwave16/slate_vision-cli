name: Bug Report
description: File a bug report to help us fix issues
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
  - type: input
    id: summary
    attributes:
      label: Short Summary
      description: Provide a clear summary of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps or commands executed in the terminal.
      placeholder: |
        1. Run 'brew install cowsay'
        2. Drag file in graph mode
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser & OS
      description: E.g., Chrome 124 on macOS Sonoma
    validations:
      required: false
